<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>pruebas GalenoFE</title>
</head>
<body>
    <h1>Pruebas GalenoFE</h1>
    <div id="lista"></div>
    <script>
        const grupos = {
        "Persona 1 - Personas, clinicas y documentos": ["clinica", "rol", "persona", "persona_rol", "tipo_documento", "documento", "tipo_medio_contacto", "medio_contacto"],
        "Persona 2 - Procedimientos y examenes": ["procedimiento", "procedimiento_paso", "procedimiento_paso_secuencia", "tipo_examen", "examen", "examen_tipo_examen", "procedimiento_paso_examen"],
        "Persona 3 - Consultas": ["consulta", "consulta_procedimiento", "consulta_procedimiento_paso", "orden_examen", "examen_resultado"]
        };
        let html = "";
        for (const [titulo, entidades] of Object.entries(grupos)) {
            html += "<h2>" + titulo + "</h2><ul>";
            for (const n of entidades) {
                html += "<li>" + n + ": <a href='unit.html?e=" + n + "'>unitaria</a> | <a href='it.html?e=" + n + "'>integracion</a></li>";
            }
            html += "</ul>";
        }
        html += "<h2>Reglas de negocio y controles</h2><ul>";
        html += "<li>identidad: <a href='unit.html?c=identidad'>unitaria</a></li>";
        html += "<li>sesion: <a href='unit.html?c=sesion'>unitaria</a></li>";
        html += "<li>default_service (errores): <a href='unit.html?c=default_service'>unitaria</a></li>";
        html += "<li>consulta_service (extra): <a href='unit.html?e=consulta'>unitaria</a></li>";
        for (const m of ["rutas", "secuencia", "citas", "fechas", "atencion", "ids"]) {
            html += "<li>" + m + ": <a href='model_test.html?m=" + m + "'>unitaria</a></li>";
        }
        html += "</ul>";
        html += "<h2>Componentes boundary (robustez/errores)</h2><ul>";
        for (const c of ["mensaje_panel", "arbol_pasos", "tarjeta_cita", "tarjeta_consulta", "pagina_base"]) {
            html += "<li>" + c + ": <a href='boundary_test.html?c=" + c + "'>unitaria</a></li>";
        }
        html += "</ul>";
        html += "<h2>Comportamiento / HU (con stubs y casos de fallo)</h2><ul>";
        const hus = [
            ["selector (HU1/HU2)", "selector"],
            ["HU1 - busqueda de citas", "hu1"],
            ["HU2 - login", "hu2"],
            ["HU3 - dashboard", "hu3"],
            ["HU4 - atencion", "hu4"],
            ["router/navegacion", "router"],
            ["nav/menu", "nav"]
        ];
        for (const [label, hu] of hus) {
            html += "<li>" + label + ": <a href='hu_test.html?hu=" + hu + "'>unitaria</a></li>";
        }
        html += "</ul>";
        document.getElementById("lista").innerHTML = html;
    </script>
</body>
</html>
